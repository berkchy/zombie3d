<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DEADWAKE</title>
<link rel="stylesheet" href="css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="modulepreload" href="js/lib/three.core.min.js">
  <link rel="modulepreload" href="js/lib/three_webgpu.min.js">
  <script type="importmap">
{
  "imports": {
    "three": "./js/lib/three_webgpu.min.js",
    "three/addons/": "./js/lib/three/"
  }
}
</script>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#0a0a10}#threeFallback{display:none;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;background:#0a0a10;color:#8899aa;font-family:monospace;font-size:14px;flex-direction:column;gap:12px}#threeFallback.show{display:flex}#threeFallback .retryBtn{padding:8px 20px;border:1px solid rgba(255,255,255,0.1);border-radius:6px;background:transparent;color:#8899aa;cursor:pointer;font-family:monospace;font-size:13px}</style>
</head>
<body>
<div id="gameContainer">
  <div id="canvas2d">
    <canvas id="overlay"></canvas>
  </div>
  <div id="gameOver">
    <div class="go-content">
      <div class="go-icon">☠</div>
      <h1>ÖLDÜN</h1>
      <div class="go-stats">
        <div class="go-stat"><span class="go-label">Puan</span><span class="go-value" id="finalScore">0</span></div>
        <div class="go-divider"></div>
        <div class="go-stat"><span class="go-label">Dalga</span><span class="go-value" id="finalWave">1</span></div>
      </div>
      <button id="menuBtn">ANA MENÜ</button>
    </div>
  </div>
</div>

<div id="loadingScreen">
  <div class="loader-card">
    <div class="loader-text">EKLENTİLER YÜKLENİYOR</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
    <div class="loader-status" id="loadStatus">0 / 0</div>
    <div class="loader-plugin" id="loadPlugin"></div>
  </div>
</div>

<div id="threeFallback">
  <div>Three.js modulu yuklenemedi</div>
  <button class="retryBtn" onclick="location.reload()">Tekrar dene</button>
</div>

<script type="module" src="js/lib/three_bootstrap.js"></script>
<script>
(function() {
  // Wait for THREE module to load, then inject main.js synchronously
  function tryLoad() {
    if (typeof THREE !== 'undefined') {
      var s = document.createElement('script');
      s.src = 'js/main.js';
      document.head.appendChild(s);
      return true;
    }
    return false;
  }
  if (!tryLoad()) {
    var check = setInterval(function() {
      if (tryLoad()) { clearInterval(check); clearTimeout(fallback); }
    }, 5);
    var fallback = setTimeout(function() {
      clearInterval(check);
      document.getElementById('threeFallback').classList.add('show');
    }, 15000);
  }
})();
</script>
</body>
</html>
