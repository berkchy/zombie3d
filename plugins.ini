###############################################################################
#  ZOMBIE SURVIVOR 3D — Plugin Listesi
#  Her satır bir plugin DOSYA ADIDIR (yol değil).
#  PluginLoader, adı js/plugins/ altında bularak yükler.
#
#  # ile başlayan satırlar yorumdur.
#  # satırbaşındaki # ile devre dışı bırakabilirsiniz.
###############################################################################


# =============================================================================
# 1) CORE — Sistem / Altyapı (yüksek öncelik, bağımlılık yok)
# =============================================================================
system_mod_loader         # Plugin modül yükleyici
system_map_intro          # Map intro animasyon sistemi
system_game_optimizer     # Performans / optimizasyon ayarları
system_reload             # Yeniden yükleme / restart yönetimi
system_touch_buttons      # Mobil dokunmatik buton sistemi
system_wave_manager       # Dalga yöneticisi (zombie spawn/zamanlama)
system_bullet             # Mermi sistemi (fizik, hedef testi)
system_movement           # Hareket fiziği (collision, step-up, hedef takibi)
core_animation            # Animasyon motoru (keyframe tabanlı)
cvars_genel               # Genel konsol değişkenleri
system_hitbox             # Hitbox sistemi (hedef tespiti, görselleştirme)
system_weapon_instance     # Silah kimlik sistemi (instanceId + merkezi kayit)
system_text_menu           # Metin menü sistemi (2D, numpad + touch)
system_class               # Sinif sistemi (kayit, secim, property)
system_speed               # Hiz sistemi (anlik hiz takibi)


# =============================================================================
# 2) EFFECTS (FX) — Görsel / İşitsel efektler
# =============================================================================
fx_sound                  # Ses motoru
fx_menu_background        # Menü arkaplan
fx_crosshair              # Nisangah (cvar ile ozellestirilebilir)
fx_decals                 # Mermi deligi + kan lekeleri
fx_skybox                 # Gökyüzü kutusu
fx_firstperson            # Birinci şahıs kamera + viewmodel overlay
camera_thirdperson        # Üçüncü şahıs kamera (thirdperson/firstperson komut + cvar)
fx_collision              # Çarpışma (zombi itme, mermi engel)
fx_damage_slow            # Hasar alınca yavaşlama efekti
fx_zombie_health          # Zombi can barı
fx_blood_splatter         # Kan sıçraması (kırmızı + yeşil-sarı sprite damlalar)
fx_tracer                 # Mermi yolu çizgisi
fx_hit_direction          # Hasar yönü oku (ekran overlay)
fx_impact_sparks          # Mermi duvara çarpınca kıvılcım
fx_zombie_spawn           # Zombi doğum tozu/dumanı
fx_dismember              # Zombi parçalama — kafa/kol/bacak kopar
fx_postprocessing         # Grafik Motoru — Bloom + Vignette + Renk + Sis + Golge
fx_thumbnail              # Silah küçük resim (hotbar ikonları)
fx_hitmarker              # Hit marker (isabet noktasinda + isareti)
fx_damage_numbers         # Hasar numaralari (zombi kafasinda)
fx_damage_screen          # Hasar alinca kirmizi flash + dusuk can kenar efekti
fx_thumbnail_helper       # Thumbnail yardımcısı (dropbox/hotbar için 3D thumb üretir)
fx_empty_click            # Boş mermi click sesi + tetik birakinca reload
fx_viewmodel_sway         # ViewModel sallanma (kamera hareketiyle)
particle_fx               # Parçacık efektleri
weapon_shake              # Atış sarsıntısı / recoil
fx_shockwave
fx_flashlight              # Şok dalgası (genişleyen çember + WaveThink trigger)
fx_slowmo                  # Slow-motion (zaman yavaslatma + matrix efekti)
ex_shockwave_test         # Test: shockwave komutu ile dalga olustur
#fx_aura_pulse            # (devre dışı) Aura dalga efekti
#fx_realistic_run         # (devre dışı) Gerçekçi koşma sallantısı


# =============================================================================
# 3) INPUT — Giriş yönetimi
# =============================================================================
input_manager             # Giriş yöneticisi (klavye/fare/dokunmatik)
input_joystick            # Mobil joystick desteği


# =============================================================================
# 5) MAPS — Haritalar (her satır bir harita, hepsi yüklenir)
# =============================================================================
map_arena                 # Arena haritası (detaylı, duvarlı)
map_polygon              # Gelişmiş Poligon (açık tavan, kule, çukur, taktik siper)
map_empty                 # Boş harita (test / özel mod)


# =============================================================================
# 7) MENU & INTRO
# =============================================================================
menu_main                 # Ana menü sistemi
intro_sequence            # Harita giriş animasyonu


# =============================================================================
# 9) ENTITIES — Oyun varlıkları (player, zombie)
# =============================================================================
player_basic              # Oyuncu varlığı (can, hasar, skor)
player_movement           # Oyuncu hareket (yürüme, koşma, collider)
zombie_basic              # Zombi varlığı (yapay zeka, spawn, wave)
zombie_boss               # Boss zombi (iri, zırhlı, her 5 dalgada bir)
entity_ragdoll             # Ragdoll fizik sistemi (3. taraf eklentiler kullanir)
entity_knockback           # Darbe geri-tepme (silah/darbe knokback + ragdoll tetikler)
entity_dropbox            # Drop kutusu (havadan süzül, silah/cephane ver)


# =============================================================================
# 10) WEAPONS — Silahlar
# =============================================================================
weapon_pistol             # Tabanca (15 mermi, tek atış)
weapon_shotgun            # Pompalı tüfek (6 saçma, yavaş)
weapon_knife              # Bıçak (yakın dövüş, arc hit)
weapon_ump45              # UMP45 SMG (25 mermi, hızlı ateş)


# =============================================================================
# 11) PICKUPS — Toplanabilir öğeler
# =============================================================================
pickup_health             # Can paketi
#pickup_xp                # (devre dışı) Deneyim puanı


# =============================================================================
# 12) MODIFIERS — Oynanış değiştiriciler
# =============================================================================
mod_combo_speed           # Combo sistemi (art arda öldürünce hızlanma)


# =============================================================================
# 13) UI — Kullanıcı arayüzü
# =============================================================================
ui_devconsole             # Geliştirici konsolu
ui_hud                    # Ana HUD (can, skor)
ui_hotbar                 # Silah çubuğu (5 slot)
ui_ammo                   # Mermi göstergesi
ui_blood_overlay          # Kan kaplama efekti
ui_pause                  # Duraklatma menüsü
ui_boss_health            # Boss can barı (thumbnail, animasyon)
ui_sound_settings         # Ses ayar paneli (slider, kayıt)
ui_wave_announcer         # Dalga bildirimi
ui_dropbox_loot           # Drop kutusu bildirimi (thumbnail + isim)
ui_model_test             # Model test odası (seçim)
ui_model_test_anim        # Model test odası (animasyon)
#ui_level                 # (devre dışı) Seviye sistemi


# =============================================================================
# 14) DEBUG / TEST
# =============================================================================
dev_zombies_cmd            # Zombi veri komutu (list/get/set)
dev_hitlogger              # Mermi/isabet takip loglayicisi
dev_map_colliders          # Harita collider goruntuleyici (komut: colliders show/hide/toggle)
test_menu                 # (test) Menu sistemi test
test_classes              # (test) Sinif kayitlari


# =============================================================================
# 15) ACTIONS — Kullanıcı eylemleri
# =============================================================================
action_drop_weapon         # Silah atma (G tusu + touch)
